<header class="header" [class.scrolled]="scrolled()">
  <div class="container header-inner">
    <a href="#hero" class="logo" aria-label="A. John Britto — home">
      <span class="logo-initials">JB</span>
      <span class="logo-name">John Britto</span>
    </a>

    <nav class="nav-desktop" aria-label="Main navigation">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" class="nav-link">{{ link.label }}</a>
      }
      <a href="mailto:jbrittoit1@gmail.com" class="btn btn-primary nav-cta">Hire Me</a>
    </nav>

    <button
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span class="bar" [class.open]="menuOpen()"></span>
    </button>
  </div>

  <nav
    id="mobile-menu"
    class="nav-mobile"
    [class.open]="menuOpen()"
    aria-label="Mobile navigation"
  >
    @for (link of navLinks; track link.href) {
      <a [href]="link.href" class="nav-link-mobile" (click)="closeMenu()">{{ link.label }}</a>
    }
    <a href="mailto:jbrittoit1@gmail.com" class="btn btn-primary" (click)="closeMenu()">Hire Me</a>
  </nav>
</header>
