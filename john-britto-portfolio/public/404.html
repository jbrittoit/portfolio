<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A. John Britto — Portfolio</title>
  <script>
    // GitHub Pages SPA redirect: preserve path in sessionStorage and redirect to root
    var path = window.location.pathname;
    var base = '/john-britto-portfolio';
    var seg = path.replace(base, '');
    sessionStorage.setItem('redirect', seg || '/');
    window.location.replace(base + '/');
  </script>
</head>
<body></body>
</html>
